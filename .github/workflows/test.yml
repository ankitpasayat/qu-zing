name: Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run linting
        working-directory: client
        run: npm run lint

      - name: Run tests with coverage
        working-directory: client
        run: npm run test:coverage
        # Coverage threshold enforced in vitest.config.ts (80% statements)
        # Test will fail if coverage drops below threshold

      - name: Verify coverage thresholds
        working-directory: client
        run: |
          echo "✅ Coverage threshold passed (80% minimum statements)"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: client/coverage/lcov.info
          flags: client
          name: client-coverage
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: client
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run linting
        working-directory: server
        run: npm run lint

      - name: Run tests with coverage
        working-directory: server
        run: npm run test:coverage
        # Coverage threshold enforced in jest.config.ts (80% statements)
        # Test will fail if coverage drops below threshold

      - name: Verify coverage thresholds
        working-directory: server
        run: |
          echo "✅ Coverage threshold passed (80% minimum statements)"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: server/coverage/lcov.info
          flags: server
          name: server-coverage
          fail_ci_if_error: false

  # Required status check - ensures all tests and coverage pass before merge
  all-tests-pass:
    name: All Tests Pass
    runs-on: ubuntu-latest
    needs: [client-tests, e2e-tests, server-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.client-tests.result }}" != "success" ]]; then
            echo "❌ Client tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.server-tests.result }}" != "success" ]]; then
            echo "❌ Server tests failed"
            exit 1
          fi
          echo "✅ All tests and coverage checks passed!"
          echo ""
          echo "Coverage requirements met:"
          echo "  - Client: 80% minimum statements"
          echo "  - Server: 80% minimum statements"
