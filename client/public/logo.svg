<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEB3B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feOffset result="offOut" in="SourceAlpha" dx="5" dy="5" />
      <feGaussianBlur result="blurOut" in="offOut" stdDeviation="0" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>
  </defs>

  <!-- Comic Burst Background -->
  <path fill="#F44336" stroke="black" stroke-width="4"
        d="M300,20 L340,80 L420,40 L390,110 L480,130 L400,180 L450,250 L360,220 L300,290 L240,220 L150,250 L200,180 L120,130 L210,110 L180,40 L260,80 Z"
        transform="scale(1.2) translate(-50 -20)" />

  <!-- Text Group -->
  <g transform="rotate(-5 300 150)">
    <!-- Main Text -->
    <text x="300" y="180" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="120" 
          fill="url(#grad1)" stroke="black" stroke-width="6" text-anchor="middle"
          style="paint-order: stroke fill; filter: url(#dropShadow);">
      Qu-Zing!
    </text>
    
    <!-- Highlights/Bolts -->
    <path d="M480,40 L460,100 L490,100 L470,160 L530,80 L500,80 Z" fill="#FFEB3B" stroke="black" stroke-width="3" transform="rotate(15 500 100)"/>
    <path d="M120,180 L100,240 L130,240 L110,300 L170,220 L140,220 Z" fill="#FFEB3B" stroke="black" stroke-width="3" transform="rotate(-15 140 240) scale(0.7)"/>
  </g>
</svg>