apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qu-zing-ingress
  namespace: qu-zing
  annotations:
    # Nginx ingress annotations for local development
    # Note: No rewrite-target - we want to preserve the original paths
    # Enable WebSocket support for Socket.io
    nginx.ingress.kubernetes.io/websocket-services: server-service
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # CORS settings - allow all for development
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  ingressClassName: nginx
  rules:
  # Single domain for local development - use tunnel URL path-based routing
  - http:
      paths:
      # API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: server-service
            port:
              number: 3000
      # Socket.io WebSocket
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: server-service
            port:
              number: 3000
      # Health check
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: server-service
            port:
              number: 3000
      # Frontend (must be last - catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: client-service
            port:
              number: 80
