apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qu-zing

resources:
  - ../../base
  - ingress-local.yaml

# Patch for local development
patches:
  - path: deployment-patches.yaml

images:
  - name: qu-zing-server
    newName: qu-zing-server
    newTag: local
  - name: qu-zing-client
    newName: qu-zing-client
    newTag: local
