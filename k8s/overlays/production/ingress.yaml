apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qu-zing-ingress
  namespace: qu-zing
  annotations:
    # Nginx ingress annotations (adjust for your ingress controller)
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Enable WebSocket support for Socket.io
    nginx.ingress.kubernetes.io/websocket-services: server-service
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # CORS settings
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    # Cert-manager annotation for automatic TLS (optional)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # TLS configuration (uncomment and configure for HTTPS)
  # tls:
  # - hosts:
  #   - your-domain.com
  #   - api.your-domain.com
  #   secretName: qu-zing-tls
  rules:
  # Client frontend
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: client-service
            port:
              number: 80
  # Server API
  - host: api.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: server-service
            port:
              number: 3000
  # Alternative: Single domain with path-based routing
  # - host: your-domain.com
  #   http:
  #     paths:
  #     - path: /api
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: server-service
  #           port:
  #             number: 3000
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: client-service
  #           port:
  #             number: 80
