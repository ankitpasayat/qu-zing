apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qu-zing

bases:
  - ../../base

resources:
  - ingress.yaml
  - hpa.yaml

# Patch for production
patchesStrategicMerge:
  - deployment-patches.yaml

images:
  - name: qu-zing-server
    newName: your-registry/qu-zing-server
    newTag: latest
  - name: qu-zing-client
    newName: your-registry/qu-zing-client
    newTag: latest
