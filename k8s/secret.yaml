apiVersion: v1
kind: Secret
metadata:
  name: qu-zing-secrets
  namespace: qu-zing
type: Opaque
stringData:
  # Replace these with your actual secrets or use external secret management
  # like Sealed Secrets, External Secrets Operator, or Vault
  DISCORD_CLIENT_SECRET: "your-discord-client-secret"
