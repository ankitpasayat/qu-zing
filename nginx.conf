events {
    worker_connections 1024;
}

http {
    upstream backend {
        # Sticky sessions for Socket.IO
        ip_hash;
        
        # Add more servers when scaling: docker-compose up --scale server=3
        server server:3000 max_fails=3 fail_timeout=30s;
    }

    upstream client {
        server client:80;
    }

    server {
        listen 80;
        server_name _;

        # Increase timeouts for long-polling/SSE
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # API routes to backend
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO to backend with WebSocket support
        location /socket.io {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Sticky sessions (backup to ip_hash)
            proxy_set_header Cookie $http_cookie;
        }

        # Everything else to client (static files)
        location / {
            proxy_pass http://client;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
